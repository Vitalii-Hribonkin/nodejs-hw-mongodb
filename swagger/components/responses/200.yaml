description: A list of contacts
content:
  application/json:
    schema:
      type: object
      properties:
        status:
          type: string
          example: success
        code:
          type: integer
          example: 200
        data:
          type: object
          properties:
            contacts:
              type: array
              items:
                $ref: ../schemas/contact.yaml
            total:
              type: integer
              example: 50
            limit:
              type: integer
              example: 10
            page:
              type: integer
              example: 1
