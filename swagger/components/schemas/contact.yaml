type: object
required:
  - _id
  - name
  - email
  - phone
properties:
  _id:
    type: string
    example: 60af884ac45d3c001f1f5c7e
  name:
    type: string
    example: John Doe
  email:
    type: string
    example: john@example.com
  phone:
    type: string
    example: '+1234567890'
  favorite:
    type: boolean
    example: false
