type: object
required:
  - _id
  - name
  - phoneNumber
  - contactType
  - createdAt
  - updatedAt
  - userId # ✅ Додано
  - photo # ✅ Додано
properties:
  _id:
    type: string
    example: '67e8225c5f7e7f491380f642'
  name:
    type: string
    example: 'Anna Kovalenko'
  phoneNumber:
    type: string
    example: '+380000000006'
  email:
    type: [string, 'null']
    example: null
  isFavourite:
    type: boolean
    example: false
  contactType:
    type: string
    enum:
      - home
      - personal
    example: 'home'
  photo:
    type: string
    example: 'https://res.cloudinary.com/.../photo.jpg' # або локальний шлях, якщо не CDN
  userId:
    type: string
    example: '665c0cfc6a2d1a001ef4e29c'
  createdAt:
    type: string
    format: date-time
    example: '2024-05-08T16:12:14.954182'
  updatedAt:
    type: string
    format: date-time
    example: '2024-05-08T16:12:14.954184'
