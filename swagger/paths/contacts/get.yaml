tags:
  - Contacts
summary: Get all contacts
operationId: getAllContacts
description: Retrieve all contacts, optionally filtered by query params
security:
  - bearerAuth: []
parameters:
  - in: query
    name: name
    schema:
      type: string
      example: John
  - in: query
    name: favorite
    schema:
      type: boolean
responses:
  '200':
    description: A list of contacts
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: '../../components/schemas/contact.yaml'
  '401':
    $ref: '../../components/responses/401.yaml'
