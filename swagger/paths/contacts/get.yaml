tags:
  - Contacts
summary: Get all contacts
operationId: getAllContacts
description: Retrieve all contacts with optional filters, pagination, and sorting
security:
  - bearerAuth: []
parameters:
  - in: query
    name: name
    schema:
      type: string
  - in: query
    name: favorite
    schema:
      type: boolean
  - in: query
    name: page
    schema:
      type: integer
  - in: query
    name: limit
    schema:
      type: integer
  - in: query
    name: sortBy
    schema:
      type: string
  - in: query
    name: sortByDesc
    schema:
      type: string
responses:
  '200':
    description: A list of contacts
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: ../../components/schemas/contact.yaml
  '401':
    $ref: ../../components/responses/401.yaml
