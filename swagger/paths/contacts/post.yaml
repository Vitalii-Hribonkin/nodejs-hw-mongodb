tags:
  - Contacts
summary: Create a contact
operationId: createContact
description: Create a new contact
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - contactType
        properties:
          name:
            type: string
            example: 'Anna Kovalenko'
          phoneNumber:
            type: string
            example: '+380000000006'
          email:
            oneOf:
              - type: string
              - type: 'null'
          isFavourite:
            type: boolean
            example: false
          contactType:
            type: string
            enum: [home, personal]
            example: 'home'
          photo:
            type: string
            format: binary
responses:
  '201':
    description: Contact created
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/contact.yaml
  '400':
    $ref: ../../components/responses/400.yaml
  '401':
    $ref: ../../components/responses/401.yaml
