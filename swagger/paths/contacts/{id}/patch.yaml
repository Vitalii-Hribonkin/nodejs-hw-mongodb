tags:
  - Contacts
summary: Update contact by id
operationId: updateContact
description: Update specific contact by ID
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: 60af884ac45d3c001f1f5c7e
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
          email:
            type: [string, 'null']
            example: null
          phoneNumber:
            type: string
          isFavourite:
            type: boolean
          contactType:
            type: string
            enum: [home, personal]
          photo:
            type: string
            format: binary
responses:
  '200':
    description: Contact updated successfully
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas/contact.yaml'
  '400':
    description: Invalid request body or missing required fields
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 400
            message:
              type: string
              example: Invalid data provided or required fields missing
  '401':
    $ref: '../../../components/responses/401.yaml'
  '404':
    description: Contact not found
